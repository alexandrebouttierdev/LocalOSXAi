# SwiftLint configuration. Rules are chosen to enforce docs/code/rules.md,
# not to maximise the number of enabled rules.
included:
  - App
  - Tests
  - UITests

excluded:
  - .build

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unowned_variable_capture
  - vertical_whitespace_closing_braces

disabled_rules:
  - todo # TODOs are allowed only with a documented reason; enforced by review (docs/code/rules.md).

line_length:
  warning: 140
  error: 180
  ignores_comments: true

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 90

identifier_name:
  min_length: 2
  excluded:
    - id
    - x
    - y

type_name:
  excluded:
    - ID # nested identity types such as `AIModel.ID` follow the `Identifiable` convention

nesting:
  type_level: 2

cyclomatic_complexity:
  warning: 12
  error: 20
