# XcodeGen specification. The .xcodeproj is generated from this file and is
# not committed. Run `make generate` after adding, moving or removing files.
# Rationale: docs/decisions/0010-xcodegen-project-generation.md
name: LocalOSXAi

options:
  bundleIdPrefix: dev.localosxai
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

# The only third-party dependency: SQLite access (docs/decisions/0006-persistence.md).
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.9.0

targets:
  LocalOSXAi:
    type: application
    platform: macOS
    dependencies:
      - package: GRDB
    sources:
      - path: App
        excludes:
          - "**/Tests"
          - "**/Tests/**"
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: LocalOSXAi
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localosxai.app
        PRODUCT_NAME: LocalOSXAi
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES

  LocalOSXAiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App
        includes:
          - "**/Tests/**"
      - path: Tests
    dependencies:
      - target: LocalOSXAi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localosxai.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LocalOSXAi:
    build:
      targets:
        LocalOSXAi: all
        LocalOSXAiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - LocalOSXAi
      targets:
        - LocalOSXAiTests
