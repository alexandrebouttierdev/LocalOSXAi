# Every push to main publishes a GitHub release with the built app.
#
# The version comes from project.yml (CFBundleShortVersionString). The first
# push of a version creates the release “v<version>”; later pushes of the
# same version create pre-releases “v<version>-build.<run>”, so a push never
# fails. Bump the version in project.yml to publish the next release.
# Run by hand with “replace files”, it rebuilds the current version and
# replaces the files of its existing release instead.
# Details: docs/code/releasing.md.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      replace_files:
        description: "Rebuild the current version and replace its existing release's files"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: make check
        run: make check

      - name: Choose the tag
        id: version
        env:
          REPLACE_FILES: ${{ inputs.replace_files || false }}
        run: |
          version=$(scripts/app-version.sh)
          replace=false
          if [[ "$REPLACE_FILES" == "true" ]] && git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            tag="v$version"
            prerelease=false
            replace=true
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            tag="v$version-build.$GITHUB_RUN_NUMBER"
            prerelease=true
          else
            tag="v$version"
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "replace=$replace" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (pre-release: $prerelease, replacing files: $replace)"

      - name: Build the app
        run: scripts/build-release.sh "$GITHUB_RUN_NUMBER"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          REPLACE: ${{ steps.version.outputs.replace }}
        run: |
          image="dist/LocalOSXAi-$VERSION.dmg"
          cat > notes.md <<NOTES
          ## Install

          1. Download **LocalOSXAi-$VERSION.dmg** below and open it.
          2. Drag **LocalOSXAi** onto **Applications**.
          3. The app is not notarized yet, so on the first launch macOS refuses it outright (“Apple could
             not confirm…”, no “Open Anyway” on the dialog itself): open **System Settings › Privacy &
             Security**, scroll to the message about LocalOSXAi being blocked and click **Open Anyway**,
             then confirm once more when you reopen the app. (Or run
             \`xattr -dr com.apple.quarantine /Applications/LocalOSXAi.app\` in Terminal instead.)

          Requires macOS 15 or later, and Ollama, LM Studio or another local model server.
          NOTES
          if [[ "$REPLACE" == "true" ]]; then
            gh release upload "$TAG" "$image" --clobber
            # Files of an older build or format (e.g. a zip) go away.
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | { grep -vxF "$(basename "$image")" || true; } \
              | while read -r name; do gh release delete-asset "$TAG" "$name" --yes; done
            gh release edit "$TAG" --notes-file notes.md
            exit 0
          fi
          flags=()
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          gh release create "$TAG" "$image" \
            --target "$GITHUB_SHA" \
            --title "LocalOSXAi $TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
