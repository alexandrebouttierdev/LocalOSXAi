# The same gate as locally: `make check` (lint, architecture rules, docs links,
# build with warnings as errors, all tests). No model server is needed.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen and SwiftLint
        run: brew install xcodegen swiftlint

      - name: make check
        run: make check
